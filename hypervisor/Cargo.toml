# Zelyr hypervisor member: P1 EL2 minimum bring-up.
# Normative build-target policy: docs/development/build-target-baseline.md.
# The boot-image layout (link.ld, wired by build.rs) is the P0-W03 reserved
# linking extension position, owned by the P1-W02 design. Identity semantics
# for `version` are P0-W16/W17 scope.
[package]
name = "hypervisor"
version = "0.1.0"
edition = "2024"
build = "build.rs"
# No dependencies, no build-dependencies, no features.
